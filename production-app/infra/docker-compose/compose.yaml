name: pimascor-demo

services:
  db:
    image: postgres:18.6-alpine3.23@sha256:e9fcfbcacfa25f66b0eea618adff3c473778463c95ea09bed245f32d4cb613e9
    container_name: pimascor-demo-db
    environment:
      POSTGRES_DB: pimascor
      POSTGRES_USER: pimascor
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - demo_postgres_data:/var/lib/postgresql
    networks:
      - pimascor-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pimascor -d pimascor"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    image: pimascor-demo-api:latest
    pull_policy: never
    container_name: pimascor-demo-api
    environment:
      APP_ENV: production
      DEPLOYMENT_TIER: demo
      APP_NAME: PIMASCOR Demo
      AUTO_MIGRATE: "false"
      DATABASE_URL_FILE: /run/secrets/database_url
      FRONTEND_ORIGINS: '["https://pimascor.delegateops.business"]'
      PUBLIC_APP_URL: https://pimascor.delegateops.business/
      SESSION_COOKIE_NAME: bridge_ph_pimascor_demo_session
      CSRF_COOKIE_NAME: bridge_ph_pimascor_demo_csrf
      SESSION_COOKIE_SECURE: "true"
      EMAIL_PROVIDER: development
      INCIDENT_EMAIL_ENABLED: "false"
      DATA_EXPORT_ENABLED: "false"
    secrets:
      - database_url
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pimascor-network
      - cloudflared-network
    expose:
      - "8000"
    tmpfs:
      - /tmp:rw,size=512m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  demo_postgres_data:

networks:
  pimascor-network:
    name: pimascor-network
    internal: true
  cloudflared-network:
    name: cloudflared-network
    external: true

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  database_url:
    file: ./secrets/database_url.txt
